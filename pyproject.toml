[project]
name = "playlisttransfer"
version = "0.3.14"
description = "Windows desktop app to move playlists between Tidal, YouTube Music and Spotify, and remove duplicates."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
