# Tests en cada push y PR. Con un tag vX.Y.Z: compila el .exe en una Windows limpia, prueba que
# abra y lo publica en Releases (zip + SHA-256). Sin acciones de terceros: solo las de GitHub y gh.
name: Test, build and release

on:
  push:
    branches: [main]
    tags: ["v*"]          # (los filtros de paths no se aplican a los tags: una versión siempre se arma)
    # Notas internas del proyecto: no cambian la app ni lo que prueban los tests (el README sí: tiene tests).
    # Cada corrida son ~6 minutos de la cuota mensual (Windows cuenta doble)
    paths-ignore: ["CLAUDE.md", "SPEC.md", "docs/*.md"]
  pull_request:
    paths-ignore: ["CLAUDE.md", "SPEC.md", "docs/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements-build.txt

      - name: Tag version matches app/__init__.py
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = python -c "import app; print(app.__version__)"
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match version $v" }

      - run: python packaging/build.py

      - name: The .exe opens without Python on PATH
        shell: pwsh
        run: |
          $exe = "dist\PlaylistTransfer\PlaylistTransfer.exe"
          $psi = New-Object System.Diagnostics.ProcessStartInfo (Resolve-Path $exe)
          $psi.UseShellExecute = $false
          $psi.EnvironmentVariables["PATH"] = ($env:PATH -split ";" | Where-Object { $_ -notmatch "Python|hostedtoolcache" }) -join ";"
          $psi.EnvironmentVariables["PT_SMOKE"] = "1"
          $p = [System.Diagnostics.Process]::Start($psi)
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Get-Content "$env:LOCALAPPDATA\PlaylistTransfer\app.log" -Tail 40; throw "The .exe did not exit within 2 minutes" }
          if ($p.ExitCode -ne 0) { Get-Content "$env:LOCALAPPDATA\PlaylistTransfer\app.log" -Tail 30; throw "The .exe did not load the UI (exit code $($p.ExitCode))" }
          "El .exe abrió y cargó la UI"

      - uses: actions/upload-artifact@v4
        with:
          name: PlaylistTransfer-windows
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          # Only the release job in this same run needs it; the permanent copy is the Release asset.
          retention-days: 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PlaylistTransfer-windows
          path: dist
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Download **PlaylistTransfer-${GITHUB_REF_NAME#v}-windows.zip**, unzip it and open \`PlaylistTransfer.exe\`. You don't need to install Python."
            echo
            echo "Windows may show *Windows protected your PC* because the program isn't signed yet: click **More info → Run anyway**."
            echo
            echo "*En castellano: [README.es.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/README.es.md).*"
            echo
            echo "SHA-256:"
            echo '```'
            cat dist/*.sha256
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "PlaylistTransfer ${GITHUB_REF_NAME}" --notes-file notes.md
