# Tests on every push and PR. With a vX.Y.Z tag: builds the .exe on a clean Windows, checks that it
# opens and publishes it in Releases (zip + SHA-256). No third-party actions: only GitHub's and gh.
name: Test, build and release

on:
  push:
    branches: [main]
    tags: ["v*"]          # (path filters don't apply to tags: a release is always built)
    # Internal project notes: they change neither the app nor what the tests check (the README does: it has tests).
    # Each run is ~6 minutes of the monthly quota (Windows counts double)
    paths-ignore: ["CLAUDE.md", "SPEC.md", "docs/*.md"]
  pull_request:
    paths-ignore: ["CLAUDE.md", "SPEC.md", "docs/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements-build.txt

      - name: Tag version matches app/__init__.py
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = python -c "import app; print(app.__version__)"
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match version $v" }

      - run: python packaging/build.py

      - name: The .exe opens without Python on PATH
        shell: pwsh
        run: |
          $exe = "dist\PlaylistTransfer\PlaylistTransfer.exe"
          $psi = New-Object System.Diagnostics.ProcessStartInfo (Resolve-Path $exe)
          $psi.UseShellExecute = $false
          $psi.EnvironmentVariables["PATH"] = ($env:PATH -split ";" | Where-Object { $_ -notmatch "Python|hostedtoolcache" }) -join ";"
          $psi.EnvironmentVariables["PT_SMOKE"] = "1"
          $p = [System.Diagnostics.Process]::Start($psi)
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Get-Content "$env:LOCALAPPDATA\PlaylistTransfer\app.log" -Tail 40; throw "The .exe did not exit within 2 minutes" }
          if ($p.ExitCode -ne 0) { Get-Content "$env:LOCALAPPDATA\PlaylistTransfer\app.log" -Tail 30; throw "The .exe did not load the UI (exit code $($p.ExitCode))" }
          "The .exe opened and loaded the UI"

      # Downloaded with a browser and unzipped with Windows Explorer, every file carries the mark of the web, and
      # .NET refuses marked assemblies unless PlaylistTransfer.exe.config says otherwise. The control proves this
      # runner reproduces it: without that file, the marked .exe must fail. (The zip is already made: not affected.)
      - name: Marked as downloaded from the internet, the .exe still opens
        shell: pwsh
        run: |
          $dir = "dist\PlaylistTransfer"
          function Open-Smoke {
            $psi = New-Object System.Diagnostics.ProcessStartInfo (Resolve-Path "$dir\PlaylistTransfer.exe")
            $psi.UseShellExecute = $false
            $psi.EnvironmentVariables["PATH"] = ($env:PATH -split ";" | Where-Object { $_ -notmatch "Python|hostedtoolcache" }) -join ";"
            $psi.EnvironmentVariables["PT_SMOKE"] = "1"
            $p = [System.Diagnostics.Process]::Start($psi)
            if (-not $p.WaitForExit(120000)) { $p.Kill(); return -1 }
            return $p.ExitCode
          }
          $files = Get-ChildItem $dir -Recurse -File
          $files | ForEach-Object { Set-Content -Path $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3`r`n" }
          "Marked $($files.Count) files as downloaded from the internet"
          Move-Item "$dir\PlaylistTransfer.exe.config" "$env:RUNNER_TEMP\PlaylistTransfer.exe.config"
          $control = Open-Smoke
          Move-Item "$env:RUNNER_TEMP\PlaylistTransfer.exe.config" "$dir\PlaylistTransfer.exe.config"
          if ($control -eq 0) { throw "Control: without the .exe.config the marked .exe opened anyway, so this check proves nothing" }
          "Control: without the .exe.config it did not open (exit code $control), as expected"
          $code = Open-Smoke
          if ($code -ne 0) { Get-Content "$env:LOCALAPPDATA\PlaylistTransfer\app.log" -Tail 30; throw "Marked as downloaded, the .exe did not load the UI (exit code $code)" }
          "Marked as downloaded, the .exe opened and loaded the UI"

      - uses: actions/upload-artifact@v7
        with:
          name: PlaylistTransfer-windows
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          # Only the release job in this same run needs it; the permanent copy is the Release asset.
          retention-days: 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: PlaylistTransfer-windows
          path: dist
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Download **PlaylistTransfer-${GITHUB_REF_NAME#v}-windows.zip**, unzip it and open \`PlaylistTransfer.exe\`. You don't need to install Python."
            echo
            echo "Windows may show *Windows protected your PC* because the program isn't signed yet: click **More info → Run anyway**."
            echo
            echo "*En castellano: [README.es.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/README.es.md).*"
            echo
            echo "SHA-256:"
            echo '```'
            cat dist/*.sha256
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "PlaylistTransfer ${GITHUB_REF_NAME}" --notes-file notes.md
